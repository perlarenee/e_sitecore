version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    # Stay on the JSS 22 line chosen in ADR 0001
    ignore:
      - dependency-name: "@sitecore-jss/*"
        update-types: ["version-update:semver-major"]
        dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
